<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create a room · HackAgon</title>
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <main id="main" class="page">
    <div class="wrap wrap--wide">
      <div class="row row--between" style="align-items:flex-end;margin-bottom:var(--sp-5);flex-wrap:wrap;gap:var(--sp-3)">
        <div>
          <span class="eyebrow">under three minutes</span>
          <h1 class="squiggle">Create a room</h1>
          <p class="lead">Every field starts with a sensible default. Change what you like, leave the rest.</p>
        </div>
        <a class="btn btn--ghost" href="create-tournament.html">Need prize money? Host a tournament</a>
      </div>
      <div id="createForm"></div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/create.js"></script>
  <script>
    (function () {
      window.App.page(async () => {
        const me = window.App.requireAuth(); if (!me) return;
        window.App.mountShell(null);
        window.CreateForm.init({ tournament: false });
      });
    })();
  </script>
</body>
</html>
