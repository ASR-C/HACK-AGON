server.port=${PORT:8080}

# TiDB Cloud / MySQL datasource configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hackagon}?useSSL=true&requireSSL=false&verifyServerCertificate=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# Static file serving: serves HTML, CSS, JS directly from parent project directory
spring.web.resources.static-locations=file:./,file:../,classpath:/static/,classpath:/public/
spring.web.resources.cache.period=0

# HackAgon application settings
hackagon.jwt.secret=${JWT_SECRET:hackagon-dev-jwt-secret-9f3c1a7be4d24f8aa6c05e7d1b93f42c}
hackagon.jwt.expiry-ms=604800000
hackagon.expose-otp=${EXPOSE_OTP_IN_RESPONSE:false}
hackagon.groq.api-key=${GROQ_API_KEY:}
hackagon.groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
hackagon.snapshots-dir=server/data/snapshots

# Brevo API configuration (Transactional email over HTTPS)
hackagon.brevo.api-key=${BREVO_API_KEY:}
hackagon.brevo.sender=${BREVO_SENDER:}
hackagon.mail.from-name=${EMAIL_FROM_NAME:HackAgon}

# Mail configuration (Gmail SMTP)
spring.mail.host=${EMAIL_HOST:smtp.gmail.com}
spring.mail.port=${EMAIL_PORT:465}
spring.mail.username=${EMAIL_USER:}
spring.mail.password=${EMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Logging
logging.level.com.hackagon=INFO
logging.level.org.springframework.web=INFO
